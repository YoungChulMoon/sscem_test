<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 시안 2차</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

:root{--bg:#1C212A;--bar:#151920;--ink:#E6EAF0;--sub:#9AA3AF;--line:#2E3540;--on:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:20px;height:60px;padding:0 20px;background:var(--bar);border-bottom:1px solid var(--line)}
header h1{margin:0 8px 0 0;font-size:16px;font-weight:700;white-space:nowrap}
header h1 small{margin-left:8px;font-size:13px;font-weight:500;color:var(--sub)}
.grp{display:flex;align-items:center;gap:8px}
.grp > span{font-size:13px;color:var(--sub);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:36px;padding:0 14px;border:0;border-left:1px solid var(--line);background:#1F242C;font:inherit;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{background:#2A303A;color:var(--ink)}
.seg button.on{background:var(--on);color:#1C212A}
#vg[hidden]{display:none}
.why{font-size:13px;color:var(--sub);white-space:nowrap}
.sp{flex:1}
.lnk{font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.hint{font-size:13px;color:var(--sub);white-space:nowrap}
.hint kbd{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#1F242C;color:var(--ink);font:inherit;font-size:12px;text-align:center}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.frame{position:absolute;left:50%;top:50%;transform-origin:0 0;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 60px -16px rgba(0,0,0,.7)}
.frame iframe{display:block;width:100%;height:100%;border:0}
.size{position:absolute;right:16px;bottom:12px;font-size:12.5px;color:var(--sub)}
@media (max-width:1500px){.hint{display:none}}
@media (max-width:1100px){.why{display:none}}
</style>
</head>
<body>
<header>
  <h1>AI 업무 포탈<small>디자인 시안 2차</small></h1>
  <div class="grp"><span>화면</span><div class="seg" id="ss"><button data-s="로그인">로그인</button><button data-s="홈">홈</button><button data-s="메인챗">메인 챗</button></div></div>
  <div class="grp" id="vg"><span>홈</span><div class="seg" id="sv"><button data-v="pro">제안안</button><button data-v="req">요청안</button></div><span class="why" id="why"></span></div>
  <span class="sp"></span>
  <div class="grp"><span>크기</span><div class="seg" id="sz"><button data-z="1920x1080">1920</button><button data-z="1366x768">1366</button><button data-z="1280x800">1280</button><button data-z="fit">창에 맞춤</button></div></div>  
  <span class="hint"><kbd>←</kbd><kbd>→</kbd> 화면 <kbd>↑</kbd><kbd>↓</kbd> 홈 안</span>
  <a class="lnk" id="open" target="_blank" rel="noopener">새 창 ↗</a>
</header>
<main id="stage"><div class="frame" id="fr"><iframe id="ifr" title="시안 화면"></iframe></div><span class="size" id="szt"></span></main>
<script>

var SS=['로그인','홈','메인챗'], VS=['pro','req'], FD={req:'요청안',pro:'제안안'}, DF={'요청안':'req','제안안':'pro'};
var WHY={req:'보내 주신 그림대로',pro:'인사말 + 작은 큐브로 첫 화면을 따뜻하게'};
var st={s:'로그인',v:'pro',z:'1920x1080'};
try{ var sv=JSON.parse(localStorage.getItem('sian2View2')||'null'); if(sv) st=Object.assign(st,sv); }catch(e){}
var ifr=document.getElementById('ifr'), fr=document.getElementById('fr'), stage=document.getElementById('stage');
function src(){ return '시안파일/'+FD[st.v]+'/'+st.s+'.html'; }
function mark(){
  [['sv','v'],['ss','s'],['sz','z']].forEach(function(p){ document.querySelectorAll('#'+p[0]+' button').forEach(function(b){ b.classList.toggle('on',b.dataset[p[1]]===st[p[1]]); }); });
  document.getElementById('vg').hidden=st.s!=='홈';
  document.getElementById('why').textContent=WHY[st.v];
  document.getElementById('open').href=src();
  try{ localStorage.setItem('sian2View2',JSON.stringify(st)); }catch(e){}
}
function load(){ mark(); ifr.src=src(); fit(); }
function fit(){
  var W=stage.clientWidth, H=stage.clientHeight, pad=32, w, h, k;
  if(st.z==='fit'){ w=W; h=H; k=1; fr.style.boxShadow='none'; }
  else { w=+st.z.split('x')[0]; h=+st.z.split('x')[1]; k=Math.min(1,(W-pad*2)/w,(H-pad*2)/h); fr.style.boxShadow=''; }
  fr.style.width=w+'px'; fr.style.height=h+'px';
  fr.style.transform='translate('+(-w*k/2)+'px,'+(-h*k/2)+'px) scale('+k+')';
  document.getElementById('szt').textContent=w+' × '+h+(k<1?' · '+Math.round(k*100)+'%로 줄여 보는 중':'');
}

window.addEventListener('message',function(e){ var d=e.data||{};
  if(d.sian){ var p=decodeURIComponent(d.sian).split('/'); var s=p.pop().replace('.html',''), v=DF[p.pop()];
    if(v) st.v=v; st.s=SS.indexOf(s)>=0?s:''; mark(); }
  if(d.sianKey) keys({key:d.sianKey,preventDefault:function(){}});
});
document.querySelectorAll('#ss button').forEach(function(b){ b.onclick=function(){ st.s=b.dataset.s; load(); }; });
document.querySelectorAll('#sv button').forEach(function(b){ b.onclick=function(){ st.v=b.dataset.v; load(); }; });
document.querySelectorAll('#sz button').forEach(function(b){ b.onclick=function(){ st.z=b.dataset.z; mark(); fit(); }; });
function step(arr,key,d){ var i=arr.indexOf(st[key]); st[key]=arr[((i<0?0:i)+d+arr.length)%arr.length]; load(); }
function keys(e){ if(e.key==='ArrowRight') step(SS,'s',1); else if(e.key==='ArrowLeft') step(SS,'s',-1);
  else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&st.s==='홈') step(VS,'v',e.key==='ArrowDown'?1:-1); else return; e.preventDefault(); }
document.addEventListener('keydown',keys);
window.addEventListener('resize',fit);
if(SS.indexOf(st.s)<0) st.s='로그인';
load();
</script>
</body>
</html>
